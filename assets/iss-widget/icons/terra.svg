<svg xmlns="http://www.w3.org/2000/svg" width="52" height="24" viewBox="0 0 52 24">
  <!-- TERRA (упрощенно): корпус с приборами в золотистой теплоизоляции, штанга, одна большая солнечная батарея, антенна -->
  <!-- Антенна -->
  <line x1="2.8" y1="12" x2="6" y2="12" stroke="#333" stroke-width="1"/>
  <ellipse cx="2.6" cy="12" rx="1.6" ry="3.2" fill="#f2f2f2" stroke="#333" stroke-width="0.7"/>
  <!-- Корпус -->
  <rect x="6" y="6" width="17" height="12" rx="1" fill="#e2c37a" stroke="#5a3e0a" stroke-width="0.8"/>
  <!-- Приборы на корпусе -->
  <g fill="#f4f4f4" stroke="#333" stroke-width="0.6">
    <rect x="8.5" y="8.2" width="5" height="4" rx="0.6"/>
    <rect x="15.5" y="8.2" width="5" height="3" rx="0.6"/>
    <rect x="15.5" y="12.6" width="5" height="3.4" rx="0.6"/>
  </g>
  <!-- Штанга -->
  <line x1="23" y1="12" x2="27" y2="12" stroke="#333" stroke-width="1.4"/>
  <!-- Солнечная батарея (одна, большая) -->
  <rect x="27" y="3" width="23.5" height="18" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/>
  <g stroke="#9cc3ec" stroke-width="0.6">
    <line x1="32.9" y1="3" x2="32.9" y2="21"/><line x1="38.75" y1="3" x2="38.75" y2="21"/>
    <line x1="44.6" y1="3" x2="44.6" y2="21"/><line x1="27" y1="12" x2="50.5" y2="12"/>
  </g>
</svg>
