# Ежедневное обновление TLE (МКС и TERRA) для виджета "МКС и TERRA сейчас"
# на главной странице сайта. Скрипт: .github/scripts/update_tle.py
name: Обновление TLE для виджета

on:
  schedule:
    - cron: '17 3 * * *'   # каждый день в 03:17 UTC (06:17 МСК)
  workflow_dispatch:        # ручной запуск: вкладка Actions -> "Обновление TLE для виджета" -> Run workflow

permissions:
  contents: write   # чтобы сохранить обновленный tle.json в репозиторий
  pages: write      # чтобы запросить пересборку сайта GitHub Pages

concurrency:
  group: update-tle
  cancel-in-progress: false

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v5   # v5 работает на Node.js 24 (v4 - на устаревшем Node.js 20)

      - name: Получить свежие TLE с CelesTrak и обновить tle.json
        run: python3 .github/scripts/update_tle.py

      # Выполняется, даже если для одного из КА TLE получить не удалось (тогда сохраняется
      # обновление остальных, а задание все равно помечается как неудачное - придет письмо)
      - name: Сохранить изменения в репозиторий
        id: commit
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- assets/iss-widget/tle.json; then
            echo "TLE не изменились - коммит не нужен"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/iss-widget/tle.json
            git commit -m "Автообновление TLE для виджета ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Коммит, сделанный из GitHub Actions, сам может не запустить сборку сайта,
      # поэтому запрашиваем ее явно
      - name: Запросить пересборку сайта GitHub Pages
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
